<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#4a6fa5">
<title>Matinales de Pádel</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f6fa; --card:#ffffff; --text:#0f172a; --muted:#334155; --line:#d5dbe6;
  --primary:#4a6fa5; --primary-soft:#e3ecf8;
  --mint:#dcf3e8; --mint-strong:#2f8f67;
  --peach:#ffe9d9; --peach-strong:#c0622a;
  --lav:#ece7fb; --lav-strong:#6a55b8;
  --rose:#fde3e6; --rose-strong:#b4424f;
  --gold:#fff4c7; --silver:#eef1f5; --bronze:#fbe7d6;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:17px}
html.fs2{font-size:19px}
html.fs3{font-size:21.5px}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);padding-bottom:96px;font-size:1rem;line-height:1.45;font-weight:500}
button,input,select{font-family:inherit}
h2,h3{font-weight:900}
b,strong{font-weight:800}
header{background:var(--primary);color:#fff;padding:14px 56px 12px;text-align:center;position:relative}
#btn-fs{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:10px;padding:6px 9px;font-weight:800;font-size:.95rem}
.bell{background:var(--rose);color:var(--rose-strong);border:1px solid #f5c6cc;border-radius:14px;padding:12px 14px;margin-bottom:14px;font-weight:600}
.bell .row{margin-top:8px}
.match{background:var(--mint);color:var(--mint-strong);border-radius:10px;padding:8px 10px;font-weight:700;margin-top:6px}
.warn{background:var(--peach);color:var(--peach-strong);border-radius:10px;padding:8px 10px;font-weight:600;margin-top:6px}
header h1{font-size:1.25rem;font-weight:900;letter-spacing:-.3px}
header .sub{font-size:.85rem;opacity:.95;margin-top:2px}
.container{max-width:620px;margin:0 auto;padding:14px 12px}
.view{display:none}.view.active{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.card h2{font-size:1.12rem;margin-bottom:10px;color:var(--primary);font-weight:900}
.card h3{font-size:.92rem;margin:12px 0 6px;color:var(--text)}
.muted{color:var(--muted);font-size:.92rem;font-weight:600}
.small{font-size:.85rem}
label{display:block;font-size:.92rem;font-weight:800;margin:8px 0 4px}
input,select{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:1rem;background:#fff;color:var(--text);outline:none}
input:focus,select:focus{border-color:var(--primary)}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--primary)}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 14px;border:none;border-radius:10px;font-size:.95rem;font-weight:700;cursor:pointer;background:var(--primary);color:#fff;width:100%;margin-top:10px}
.btn.sec{background:var(--primary-soft);color:var(--primary)}
.btn.mint{background:var(--mint);color:var(--mint-strong)}
.btn.peach{background:var(--peach);color:var(--peach-strong)}
.btn.rose{background:var(--rose);color:var(--rose-strong)}
.btn.sm{width:auto;padding:8px 11px;font-size:.88rem;margin-top:0}
.btn.big{padding:18px;font-size:1.05rem}
.btn:disabled{opacity:.5}
.chip{display:inline-block;padding:2px 9px;border-radius:20px;font-size:.8rem;font-weight:700;background:var(--silver);color:var(--muted);white-space:nowrap}
.chip.mint{background:var(--mint);color:var(--mint-strong)}
.chip.peach{background:var(--peach);color:var(--peach-strong)}
.chip.lav{background:var(--lav);color:var(--lav-strong)}
.chip.rose{background:var(--rose);color:var(--rose-strong)}
.chip.blue{background:var(--primary-soft);color:var(--primary)}
.banner{border-radius:14px;padding:14px 16px;margin-bottom:14px;background:var(--peach);color:#6b3512;border:1px solid #f6d2b8}
.banner b{display:block;font-size:1rem;margin-bottom:4px}
.list-item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:none}
.list-item .name{font-weight:800}
.pl2 .nm{font-weight:800!important}
.btn{font-weight:800}
.plazo{display:block;text-align:center;font-weight:800;color:#8f3f10;background:#ffe3cf;border-radius:10px;padding:8px;margin-top:8px}
.rank-row{display:flex;align-items:center;gap:10px;padding:10px 8px;border-bottom:1px solid var(--line);border-radius:8px}
.rank-row .pos{width:28px;text-align:center;font-weight:800;color:var(--muted)}
.rank-row .who{flex:1;min-width:0}
.rank-row .who .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank-row .pts{background:var(--primary-soft);color:var(--primary);font-weight:800;padding:4px 10px;border-radius:14px;min-width:46px;text-align:center}
.rank-row.p1{background:var(--gold)}.rank-row.p2{background:var(--silver)}.rank-row.p3{background:var(--bronze)}
.rank-row.me{outline:2px solid var(--primary);outline-offset:-2px}
.seg{display:flex;background:var(--silver);border-radius:10px;padding:3px;margin-bottom:10px}
.seg button{flex:1;border:none;background:none;padding:8px;border-radius:8px;font-weight:700;color:var(--muted);font-size:.88rem}
.seg button.on{background:#fff;color:var(--primary);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.court{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px;background:#fafbfd}
.court .t{font-weight:800;font-size:.85rem;color:var(--primary);text-transform:uppercase;margin-bottom:6px;display:flex;justify-content:space-between}
.court .teams{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center}
.court .vs{font-weight:900;color:var(--peach-strong);font-size:.85rem}
.slot{display:block;width:100%;padding:9px 6px;border-radius:8px;background:#fff;border:1.5px solid var(--line);font-size:.92rem;text-align:center;margin:3px 0;color:var(--text)}
button.slot{cursor:pointer}
.slot.sel{border-color:var(--peach-strong);background:var(--peach)}
.slot.mine{background:var(--mint);border-color:#b7e3cd;font-weight:700}
.lvl{font-size:.8rem;color:var(--muted);margin-left:3px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--silver);border-radius:10px;padding:10px 6px;text-align:center}
.stat .v{font-size:1.3rem;font-weight:800;color:var(--primary)}
.stat .l{font-size:.8rem;color:var(--muted)}
nav.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav.bottom button{flex:1;border:none;background:none;padding:9px 2px 8px;font-size:.78rem;color:var(--muted);font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.bottom button .i{font-size:1.25rem}
nav.bottom button.on{color:var(--primary)}
.subtabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
.subtabs button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:7px 12px;font-weight:700;font-size:.9rem;color:var(--muted);white-space:nowrap}
.subtabs button.on{background:var(--primary);color:#fff;border-color:var(--primary)}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#27324a;color:#fff;padding:10px 16px;border-radius:10px;font-size:.9rem;display:none;z-index:50;max-width:90%;text-align:center}
.hidden{display:none!important}
.center{text-align:center}
.empty{text-align:center;color:var(--muted);padding:14px;font-size:.9rem}
.alert{background:var(--lav);color:var(--lav-strong);border-radius:10px;padding:10px 12px;font-size:.86rem;margin-top:8px}
.num{display:inline-flex;align-items:center;justify-content:center;width:1.6rem;height:1.6rem;border-radius:50%;background:var(--primary-soft);color:var(--primary);font-weight:800;font-size:.75rem;flex:none}
.inline-lvl{width:4.2rem;padding:6px;text-align:center;font-weight:700}
.alarm{background:#fdd9dd;color:#8e1f2c;border:2px solid #e8959f;border-radius:14px;padding:14px;margin-bottom:14px}
.alarm h2{color:#8e1f2c;font-size:1.15rem;margin-bottom:8px}
.alarm .it{background:#fff;border-radius:10px;padding:10px 12px;margin-top:8px}
.alarm .it .n{font-size:1.1rem;font-weight:800}
.tardia{display:inline-block;background:#8e1f2c;color:#fff;border-radius:6px;padding:1px 7px;font-size:.8rem;font-weight:800;margin-top:4px}
.counter{background:var(--silver);border-radius:12px;padding:10px 12px;margin:8px 0;font-weight:600}
.counter .big{font-size:1.25rem;font-weight:800;color:var(--primary)}
.slot.hueco{background:var(--rose);border-color:#eaa3ab;color:var(--rose-strong);font-weight:700}
.circ-chip{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.82rem;font-weight:800;background:var(--primary-soft);color:var(--primary)}
.circ-chip.og{background:var(--lav);color:var(--lav-strong)}
.checkrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.checkrow input{flex:none}
.btn.wa{background:#25d366;color:#fff}
/* ===== panel administradora ===== */
#btn-bell{position:absolute;left:10px;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:12px;width:46px;height:42px;font-size:1.3rem}
#btn-bell b{position:absolute;top:-7px;right:-7px;background:#ef4444;color:#fff;border-radius:12px;min-width:23px;height:23px;font-size:.8rem;display:flex;align-items:center;justify-content:center;padding:0 5px;border:2px solid var(--primary)}
#btn-bell b:empty{display:none}
nav.bottom button{min-width:0;white-space:nowrap;font-size:.72rem}
.fab{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:12;background:#10b981;color:#fff;border:none;border-radius:30px;padding:16px 22px;font-weight:900;font-size:1.05rem;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.al{display:flex;gap:10px;align-items:center;padding:13px;border-radius:14px;margin-bottom:10px;font-weight:800;border:none;width:100%;text-align:left;font-size:1rem}
.al .ic{font-size:1.6rem}.al .tx{flex:1}.al .tx small{display:block;font-weight:600;font-size:.85rem;opacity:.9}.al .go{font-weight:900;font-size:1.4rem}
.al.r{background:var(--rose);color:var(--rose-strong)}.al.m{background:var(--mint);color:var(--mint-strong)}.al.l{background:var(--lav);color:var(--lav-strong)}
.stat3{display:flex;gap:8px;margin-top:10px}.stat3 div{flex:1;background:var(--primary-soft);border-radius:12px;padding:10px 4px;text-align:center}
.stat3 b{display:block;font-size:1.9rem;color:var(--primary);line-height:1.05}.stat3 span{font-size:.78rem;font-weight:700;color:var(--muted)}
.sec-t{font-weight:900;font-size:.85rem;letter-spacing:.6px;color:var(--muted);margin:16px 2px 8px;text-transform:uppercase}
.jc{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;display:flex;gap:12px;align-items:center;width:100%;text-align:left;font-size:1rem;color:var(--text)}
.jc .d{background:var(--primary-soft);color:var(--primary);border-radius:12px;width:60px;text-align:center;padding:6px 0;font-weight:900;flex:none}
.jc .d b{display:block;font-size:1.5rem;line-height:1}.jc .d small{font-size:.72rem}
.jc .d.og{background:var(--lav);color:var(--lav-strong)}
.jc .i{flex:1;min-width:0}.jc .i .n{font-weight:800}.jc .ar{font-size:1.5rem;color:var(--muted)}
.dethd{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.dethd .bk,.dethd .mn{border:none;background:#fff;border:1px solid var(--line);border-radius:12px;width:46px;height:46px;font-size:1.4rem;font-weight:900;color:var(--primary);flex:none}
.dethd .tt{flex:1;min-width:0}.dethd .tt b{display:block;font-size:1.12rem}.dethd .tt small{color:var(--muted);font-weight:600}
.steps{display:flex;gap:4px;margin:8px 0 4px}
.steps div{flex:1;text-align:center;font-size:.74rem;font-weight:800;color:var(--muted)}
.steps div i{display:block;height:8px;border-radius:4px;background:var(--line);margin-bottom:4px}
.steps div.done i{background:#10b981}.steps div.now i{background:var(--primary)}.steps div.now{color:var(--primary)}
.dtabs{display:flex;background:#fff;border-radius:14px;padding:4px;margin:12px 0;border:1px solid var(--line)}
.dtabs button{flex:1;border:none;background:none;padding:11px 2px;border-radius:10px;font-weight:800;color:var(--muted);font-size:.86rem;white-space:nowrap}
.dtabs button.on{background:var(--primary);color:#fff}
.pl2{display:flex;align-items:center;gap:8px;padding:11px 2px;border-bottom:1px solid var(--line)}
.pl2:last-child{border-bottom:none}
.pl2 .nm{flex:1;min-width:0;font-weight:700}.pl2 .nm small{display:block;color:var(--muted);font-weight:600;font-size:.82rem}
.pl2 .dots{border:none;background:var(--silver);border-radius:10px;width:44px;height:40px;font-size:1.3rem;font-weight:900;color:var(--muted);flex:none}
.mi{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:10px;font-weight:800;font-size:1.05rem;width:100%;text-align:left;color:var(--text)}
.mi i{font-style:normal;font-size:1.5rem;width:34px;text-align:center}.mi span{flex:1}.mi small{display:block;font-weight:600;color:var(--muted);font-size:.85rem}
#modal{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:42;display:flex;align-items:flex-end;justify-content:center}
#modal .sh{background:#fff;width:100%;max-width:620px;border-radius:22px 22px 0 0;padding:14px 16px 24px;max-height:92vh;overflow-y:auto}
#modal .grab{width:46px;height:5px;background:var(--line);border-radius:3px;margin:0 auto 12px}
#modal h2{font-size:1.25rem;margin-bottom:6px;color:var(--text)}
details.more{margin-top:12px;background:var(--bg);border-radius:12px;padding:10px 12px}
details.more summary{font-weight:800;color:var(--primary);cursor:pointer}
/* hoja de resultados */
#sheet{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
#sheet .sh{background:#fff;width:100%;max-width:620px;border-radius:22px 22px 0 0;padding:18px 14px 22px;max-height:92vh;overflow-y:auto}
#sheet h2{font-size:1.35rem;text-align:center}
#sheet .sub{text-align:center;color:var(--muted);margin:4px 0 12px}
#sheet .pl{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 4px;border-bottom:1px solid var(--line)}
#sheet .pl .n{font-weight:800;font-size:1.05rem}
#sheet .pl.yo{background:var(--mint);border-radius:10px;padding:11px 8px}
.btn.win{background:var(--mint);color:var(--mint-strong);border:2px solid #9fd9bd;padding:24px;font-size:1.2rem}
.btn.lose{background:var(--primary-soft);color:var(--primary);border:2px solid #b9cdea;padding:24px;font-size:1.2rem}
.cta{display:block;width:100%;padding:18px;border:none;border-radius:14px;font-size:1.1rem;font-weight:900;background:#10b981;color:#fff;margin-top:10px}
/* cronómetro */
#crono{position:fixed;inset:0;z-index:45;background:#0f172a;color:#f8fafc;overflow-y:auto;--c2:#1e293b;--cm:#cbd5e1;--lime:#a3e635;--em:#10b981}
#crono.claro{background:#f8fafc;color:#0f172a;--c2:#e2e8f0;--cm:#334155;--lime:#3f6212;--em:#047857}
#crono .in{max-width:620px;margin:0 auto;padding:16px 14px 30px;text-align:center}
#crono .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
#crono .top button{border:none;border-radius:12px;padding:10px 14px;font-weight:900;font-size:1rem;background:var(--c2);color:inherit}
#crono .tit{font-weight:800;color:var(--cm);margin-top:14px}
#crono .rd{font-weight:900;color:var(--lime);font-size:1.3rem;letter-spacing:.5px;margin-top:14px}
#crono .clk{font-size:min(30vw,9rem);font-weight:900;font-variant-numeric:tabular-nums;line-height:1;margin:10px 0}
#crono .nx{font-size:1.2rem;font-weight:700;color:var(--cm)}
#crono .bar{height:12px;background:var(--c2);border-radius:8px;overflow:hidden;margin:16px 0}
#crono .bar i{display:block;height:100%;background:var(--em);width:0}
#crono .tiempo{background:#ef4444;color:#fff;border-radius:16px;padding:18px 10px;font-weight:900;font-size:2rem;margin:10px 0;animation:parp 1s infinite}
@keyframes parp{50%{opacity:.6}}
#crono .bt{display:block;width:100%;padding:16px;border:none;border-radius:14px;font-weight:900;font-size:1.1rem;margin-top:10px}
#crono .snd{background:var(--lime);color:#0f172a}
#crono .ok{background:var(--c2);color:inherit}
#crono .adj{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:14px}
#crono .adj button{border:none;border-radius:12px;padding:12px 16px;font-weight:900;font-size:1.05rem;background:var(--c2);color:inherit}
#crono .lst{margin-top:16px;text-align:left;background:var(--c2);border-radius:14px;padding:10px 14px}
#crono .lst div{display:flex;justify-content:space-between;padding:5px 0;font-weight:700}
#crono .lst .done{opacity:.45;text-decoration:line-through}
#crono .lst .now{color:var(--lime)}
.box{border:2px solid var(--primary);border-radius:12px;padding:12px;margin:10px 0;background:#fff}
.seg.wrap{flex-wrap:wrap}
</style>
</head>
<body>
<header>
  <button id="btn-bell" class="hidden" data-act="nav" data-v="a-avisos" aria-label="Avisos">🔔<b id="bell-n"></b></button>
  <h1>🎾 Matinales de Pádel</h1>
  <button id="btn-fs" data-act="fs" aria-label="Tamaño de letra">A+</button>
  <div class="sub" id="hdr-sub">Americanas · Ranking en vivo</div>
</header>

<div class="container">

  <!-- ============ INICIO ============ -->
  <section class="view active live" id="v-inicio">
    <div id="ini-bell"></div>
    <div id="ini-banner"></div>
    <div id="ini-jornadas"></div>
    <div id="ini-top"></div>
  </section>

  <!-- ============ RANKING ============ -->
  <section class="view live" id="v-ranking">
    <div class="card">
      <div class="seg wrap" id="rank-circs"></div>
      <div class="seg" id="rank-modes">
        <button data-act="rankMode" data-v="puntos" id="seg-puntos" class="on">🏆 Puntos</button>
        <button data-act="rankMode" data-v="asistencia" id="seg-asistencia">📅 Asistencia</button>
      </div>
      <select id="rank-temp"></select>
      <div id="rank-info" class="muted small" style="margin:8px 0"></div>
      <div id="rank-list"></div>
    </div>
  </section>

  <!-- ============ AMERICANA ============ -->
  <section class="view live" id="v-americana">
    <div class="card" id="ame-selcard"><select id="ame-sel"></select></div>
    <div id="ame-content"></div>
  </section>

  <!-- ============ PERFIL ============ -->
  <section class="view" id="v-perfil">
    <div id="perfil-live" class="live"></div>
    <div id="perfil-forms">
      <div class="card" id="f-login">
        <h2>Entrar</h2>
        <label>Teléfono</label><input id="li-tel" type="tel" inputmode="numeric" placeholder="600123456">
        <label>PIN (4 cifras)</label><input id="li-pin" type="password" inputmode="numeric" maxlength="4" placeholder="••••">
        <button class="btn" data-act="login">Entrar</button>
        <p class="muted small" style="margin-top:8px">¿Has olvidado el PIN? Díselo a Luz y te lo reinicia.</p>
      </div>
      <div class="card" id="f-registro">
        <h2>¿Primera vez? Date de alta</h2>
        <label>Nombre y apellido</label><input id="rg-nombre" placeholder="Ej: Laura Martínez">
        <label>Teléfono</label><input id="rg-tel" type="tel" inputmode="numeric" placeholder="600123456">
        <div class="row">
          <div><label>Elige un PIN</label><input id="rg-pin" type="password" inputmode="numeric" maxlength="4" placeholder="4 cifras"></div>
          <div><label>Repite el PIN</label><input id="rg-pin2" type="password" inputmode="numeric" maxlength="4" placeholder="4 cifras"></div>
        </div>
        <button class="btn mint" data-act="registro">Solicitar alta</button>
        <p class="muted small" style="margin-top:8px">Luz revisará tu alta antes de que puedas apuntarte.</p>
      </div>

<script id="logic">
const PTS = { ganado: 8, perdido: 6, asistencia: 5 };   // 5 asistir + 3 ganado / +1 perdido
const MAX_PTS_JORNADA = 8;
const MESES = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];

function tsMs(t){
  if (t == null) return Date.now();
  if (typeof t === 'number') return t;
  if (typeof t.toMillis === 'function') return t.toMillis();
  if (t.seconds != null) return t.seconds * 1000 + Math.floor((t.nanoseconds || 0) / 1e6);
  return Date.now();
}
function jornadaKey(j){ return (j.fecha || '') + ' ' + (j.hora || ''); }

/* Temporada a la que pertenece una fecha según la duración del circuito */
function periodo(dur, fecha){
  const [y, m] = fecha.split('-').map(Number);
  const pad = n => String(n).padStart(2, '0');
  const ultimoDia = (yy, mm) => new Date(Date.UTC(yy, mm, 0)).toISOString().slice(0, 10);
  if (dur === '3m'){
    const off = (m - 9 + 12) % 12, so = off - off % 3;
    const sm = ((8 + so) % 12) + 1, sy = sm > m ? y - 1 : y;
    const em = ((sm - 1 + 2) % 12) + 1, ey = em < sm ? sy + 1 : sy;
    return { key: `${sy}-${pad(sm)}`, nombre: sy === ey ? `${MESES[sm - 1]}–${MESES[em - 1]} ${sy}` : `${MESES[sm - 1]} ${sy}–${MESES[em - 1]} ${ey}`, fin: ultimoDia(ey, em) };
  }
  if (dur === 'curso'){ const sy = m >= 9 ? y : y - 1; return { key: `${sy}-09`, nombre: `Curso ${sy}-${String(sy + 1).slice(2)}`, fin: `${sy + 1}-06-30` }; }
  if (dur === 'anio') return { key: `${y}-01`, nombre: `Año ${y}`, fin: `${y}-12-31` };
  const sm = m - ((m - 1) % 2), em = sm + 1;    // 2 meses: Ene–Feb, Mar–Abr … Sep–Oct, Nov–Dic
  return { key: `${y}-${pad(sm)}`, nombre: `${MESES[sm - 1]}–${MESES[em - 1]} ${y}`, fin: ultimoDia(y, em) };
}

/* Ranking de una temporada. Desempate: quien envió antes su resultado en la última americana que jugaron ambos. */
function calcRanking(resultados, jornadas, tid){
  const jk = {}; jornadas.forEach(j => jk[j.id] = jornadaKey(j));
  const st = {};
  resultados.forEach(r => {
    if (!tid || r.temporadaId !== tid || r.estado !== 'aprobado') return;
    const s = st[r.playerId] || (st[r.playerId] = { pid: r.playerId, pts: 0, asist: 0, gan: 0, per: 0, porJ: {} });
    s.pts += PTS[r.resultado] || 0;
    s.asist++;
    if (r.resultado === 'ganado') s.gan++;
    if (r.resultado === 'perdido') s.per++;
    s.porJ[r.jornadaId] = tsMs(r.ts);
  });
  const cmpDesempate = (a, b) => {
    const comunes = Object.keys(a.porJ).filter(j => j in b.porJ).sort((x, y) => (jk[y] || '').localeCompare(jk[x] || ''));
    if (comunes.length){ const d = a.porJ[comunes[0]] - b.porJ[comunes[0]]; if (d) return d; }
    return b.asist - a.asist;
  };
  const porPuntos = Object.values(st).sort((a, b) => (b.pts - a.pts) || cmpDesempate(a, b));
  porPuntos.forEach((s, i) => {
    s.pos = i + 1;
    const prev = porPuntos[i - 1];
    s.empateGanado = !!(porPuntos[i + 1] && porPuntos[i + 1].pts === s.pts);
    s.distAnterior = prev ? prev.pts - s.pts : null;
  });
  const porAsistencia = [...porPuntos].sort((a, b) => (b.asist - a.asist) || (a.pos - b.pos));
  porAsistencia.forEach((s, i) => s.posA = i + 1);
  return { porPuntos, porAsistencia };
}

/* Propuesta de primer partido: pista 1 = más nivel, respetando parejas fijas. 4 sueltos: 1º+4º vs 2º+3º. */
function generarPropuesta(inscritos, nivelDe){
  const ids = new Set(inscritos.map(i => i.id));
  const usados = new Set(), pares = [];
  inscritos.forEach(i => {
    const p = i.parejaId;
    if (usados.has(i.id) || !p || p === i.id || !ids.has(p) || usados.has(p)) return;
    usados.add(i.id); usados.add(p);
    pares.push({ pair: [i.id, p], lvl: (nivelDe(i.id) + nivelDe(p)) / 2 });
  });
  pares.sort((a, b) => b.lvl - a.lvl);
  const sueltos = inscritos.filter(i => !usados.has(i.id)).map(i => ({ id: i.id, lvl: nivelDe(i.id) })).sort((a, b) => b.lvl - a.lvl);
  const nPistas = Math.floor(inscritos.length / 4);
  let pi = 0, si = 0;
  const pistas = [], reservas = [];
  for (let c = 0; c < nPistas; c++){
    const units = []; let filled = 0;
    while (filled < 4){
      const np = pares[pi], ns = sueltos[si];
      const puedePar = np && filled <= 2;
      if (puedePar && (!ns || np.lvl >= ns.lvl)){ units.push({ pair: np.pair }); pi++; filled += 2; }
      else if (ns){ units.push({ s: ns }); si++; filled++; }
      else break;
    }
    if (filled < 4){ units.forEach(u => u.pair ? reservas.push(...u.pair) : reservas.push(u.s.id)); break; }
    const fijas = units.filter(u => u.pair).map(u => u.pair);
    const s = units.filter(u => u.s).map(u => u.s).sort((a, b) => b.lvl - a.lvl).map(x => x.id);
    let A, B;
    if (fijas.length === 2){ A = fijas[0]; B = fijas[1]; }
    else if (fijas.length === 1){ A = fijas[0]; B = [s[0], s[1]]; }
    else { A = [s[0], s[3]]; B = [s[1], s[2]]; }
    pistas.push({ a1: A[0], a2: A[1], b1: B[0], b2: B[1] });
  }
  for (; pi < pares.length; pi++) reservas.push(...pares[pi].pair);
  for (; si < sueltos.length; si++) reservas.push(sueltos[si].id);
  return { pistas, reservas };
}

/* Cuentas de plazas: quién entra, quién sobra y quién está en lista de espera (por orden de inscripción) */
function calcPlazas(activosOrdenados, minPistas, maxPistas){
  const max = (maxPistas || 8) * 4, min = (minPistas || 4) * 4;
  const dentro = activosOrdenados.slice(0, max), espera = activosOrdenados.slice(max);
  const pistas = Math.floor(dentro.length / 4), sobran = dentro.length % 4;
  return {
    total: activosOrdenados.length, dentro, espera, pistas, sobran,
    juegan: dentro.slice(0, pistas * 4), reservas: dentro.slice(pistas * 4),
    faltanOtra: dentro.length >= max ? 0 : 4 - sobran,
    faltanMin: Math.max(0, min - dentro.length), lleno: dentro.length >= max
  };
}

function aTiro(porPuntos, pid){
  const i = porPuntos.findIndex(s => s.pid === pid);
  if (i < 0) return { arriba: [], abajo: [] };
  const me = porPuntos[i];
  return {
    arriba: porPuntos.slice(0, i).filter(s => s.pts - me.pts <= MAX_PTS_JORNADA).map(s => ({ pid: s.pid, dif: s.pts - me.pts })),
    abajo: porPuntos.slice(i + 1).filter(s => me.pts - s.pts <= MAX_PTS_JORNADA).map(s => ({ pid: s.pid, dif: me.pts - s.pts }))
  };
}
if (typeof module !== 'undefined') module.exports = { PTS, tsMs, periodo, calcRanking, generarPropuesta, calcPlazas, aTiro };
</script>

  t += j.pistas.map((p, k) => `*Pista ${k + 1}:* ${nom(p.a1)} y ${nom(p.a2)} 🆚 ${nom(p.b1)} y ${nom(p.b2)}`).join('\n');
  if (j.reservas?.length) t += '\n\nReservas: ' + j.reservas.map(nom).join(', ');
  return t + '\n\n¡Suerte a todos! 💪\n👉 ' + APP_URL;
}
function msgRecordatorio(j){
  const env = new Set(resJ(j.id).map(r => r.playerId));
  const faltan = activos(j.id).filter(i => !env.has(i.id)).map(i => nom(i.id));
  const d = new Date(plazoMs(j));
  return `${cabecera(j)}\n\n🏁 ¿Todavía no has apuntado el resultado de tu *último partido*?\n⏰ Tienes hasta el *${d.toLocaleDateString('es-ES', { weekday: 'long' })} a las ${hhmm(plazoMs(j))}*. ¡Cuenta para el ranking!\n\nFaltan: ${faltan.join(', ')}\n\n👉 Apúntalo aquí (sin registrarte): ${APP_URL}`;
}
function msgResultadosDia(j){
  const rs = resJ(j.id), gan = rs.filter(r => r.resultado === 'ganado').map(r => nom(r.playerId));
  let t = `${cabecera(j)}\n\n🏁 *¡Gracias a los ${rs.length} que vinisteis!*`;
  if (gan.length) t += `\n🏆 Ganaron el último partido: ${gan.join(', ')}`;
  if (j.temporadaId){ const top = calcRanking(S.resultados, S.jornadas, j.temporadaId).porPuntos.slice(0, 3); if (top.length) t += `\n\n🏆 *Top 3 ${j.temporadaNombre}*\n` + top.map(x => `${['🥇', '🥈', '🥉'][x.pos - 1]} ${nom(x.pid)} — ${x.pts} pts`).join('\n'); }
  return t + '\n\n👉 Ranking: ' + APP_URL;
}
function msgRanking(cid, tid, modo){
  const c = circ(cid), rk = calcRanking(S.resultados, S.jornadas, tid);
  const lista = modo === 'puntos' ? rk.porPuntos : rk.porAsistencia;
  const tn = temporadasDe(cid).find(t => t.id === tid)?.nombre || '';
  let t = `🏆 *RANKING ${c.nombre.toUpperCase()}${modo === 'asistencia' ? ' · ASISTENCIA' : ''}* · ${tn}\n\n`;
  t += lista.slice(0, 10).map(s => { const pos = modo === 'puntos' ? s.pos : s.posA; return `${pos <= 3 ? ['🥇', '🥈', '🥉'][pos - 1] : pos + '.'} ${nom(s.pid)} — ${modo === 'puntos' ? s.pts + ' pts' : s.asist + ' americana' + (s.asist === 1 ? '' : 's')}`; }).join('\n');
  const ult = jornadasOrd().find(j => j.ultima && j.estado !== 'cerrada' && j.temporadaId === tid);
  if (ult) t += `\n\n🏁 La americana del *${fmtFecha(ult, false)}* es la ÚLTIMA de la temporada. Una victoria da 8 puntos: ¡todo puede cambiar! 🔥`;
  return t + '\n\n👉 Ranking en vivo: ' + APP_URL;
}

/* ---------- CIERRE AUTOMÁTICO 48 h DESPUÉS DE TERMINAR ---------- */
const autoCerradas = new Set();
async function autoCerrar(){
  if (!S.isAdmin || !S.loaded.jornadas) return;
  const viejas = S.jornadas.filter(j => j.estado !== 'cerrada' && j.fecha && j.hora && Date.now() > plazoMs(j) && !autoCerradas.has(j.id));
  if (!viejas.length) return;
  viejas.forEach(j => autoCerradas.add(j.id));
  try { const b = writeBatch(db); viejas.forEach(j => b.update(doc(db, 'jornadas', j.id), { estado: 'cerrada', cerradaAuto: true })); await b.commit(); }
  catch (e){ console.error(e); }
}

/* ---------- MIGRACIÓN (una sola vez, la hace una administradora) ---------- */
async function migrar(){
  if (!S.isAdmin || migrando || !S.loaded.circuitos || !S.loaded.jornadas || !S.loaded.resultados || !S.loaded.temporadas) return;
  const sinCirc = S.jornadas.filter(j => !j.circuitoId);
  const sinFin = S.jornadas.filter(j => j.circuitoId && j.finMs == null);
  if (S.circuitos.length && !sinCirc.length && !sinFin.length && !S.temporadasViejas.length) return;
  migrando = true;
  try {
    const b = writeBatch(db);
    if (!S.circuitos.length) CIRCUITOS_INICIALES.forEach(({ id, ...c }) => b.set(doc(db, 'circuitos', id), c));
    sinCirc.forEach(j => {
      const p = periodo('2m', j.fecha);
      const tid = `matinales_${p.key}`;
      b.update(doc(db, 'jornadas', j.id), { circuitoId: 'matinales', acceso: 'todos', amistosa: false, temporadaId: tid, temporadaNombre: p.nombre, temporadaFin: p.fin, minPistas: 4, maxPistas: 8, rondas: 6, minRonda: 20, finMs: finMs(j) });
      S.resultados.filter(r => r.jornadaId === j.id).forEach(r => b.update(doc(db, 'resultados', r.id), { temporadaId: tid }));
    });
    sinFin.forEach(j => b.update(doc(db, 'jornadas', j.id), { rondas: nRondas(j), minRonda: minRonda(j), finMs: finMs(j) }));
    S.temporadasViejas.forEach(t => b.delete(doc(db, 'temporadas', t.id)));
    await b.commit();
    if (sinCirc.length || S.temporadasViejas.length) toast('App actualizada a circuitos ✅');
  } catch (e){ console.error(e); toast(errMsg(e), 5000); }
  setTimeout(() => { migrando = false; }, 3000);
}

const editing = () => { const a = document.activeElement; return a && /INPUT|SELECT|TEXTAREA/.test(a.tagName) && a.type !== 'checkbox' && a.closest('.live'); };
function render(){ if (editing()){ pendingRender = true; return; } pendingRender = false; doRender(); }
document.addEventListener('focusout', () => { if (pendingRender) setTimeout(() => { if (!editing() && pendingRender) render(); }, 350); });

function doRender(){
  const adminUI = S.isAdmin && !S.asPid;
  if (adminUI && ['inicio', 'americana', 'perfil'].includes(S.view)) S.view = 'a-inicio';
  if (!adminUI && S.view.startsWith('a-')) S.view = 'inicio';
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === 'v-' + S.view));
  const navOn = S.view === 'a-avisos' ? 'a-inicio' : S.view === 'a-circuitos' ? 'a-mas' : S.view;
  document.querySelectorAll('nav.bottom button').forEach(b => b.classList.toggle('on', b.dataset.v === navOn));
  $('nav-jug').classList.toggle('hidden', adminUI);
  $('nav-adm').classList.toggle('hidden', !adminUI);
  $('btn-bell').classList.toggle('hidden', !adminUI);
  $('bell-n').textContent = adminUI && nAvisos() ? nAvisos() : '';
  const fab = adminUI && S.view === 'a-americanas' && !S.admDet ? '＋ Nueva' : adminUI && S.view === 'a-jugadores' ? '＋ Añadir' : '';

  const m = me();
  $('hdr-sub').textContent = S.isAdmin && m ? '👁️ Viendo como ' + m.nombre : S.isAdmin ? '⚙️ Administradora' : m ? '👋 Hola, ' + m.nombre.split(' ')[0] : 'Americanas · Ranking en vivo';

/* ----- Inicio ----- */
function renderInicio(){
  const m = me();
  // Avisos arriba
  let bell = '';
  if (S.isAdmin && m) bell += `<div class="bell" style="background:var(--lav);color:var(--lav-strong);border-color:#d9d0f5">👁️ <b>Modo prueba:</b> estás viendo la app como <b>${esc(m.nombre)}</b>. Lo que hagas se guarda de verdad a su nombre.
      <div class="row"><button class="btn sm" style="background:#fff;color:var(--lav-strong)" data-act="verComo" data-p="">Salir del modo prueba</button></div></div>`;
  if (false){
    const nSol = S.solicitudes.length, nRes = S.resultados.filter(r => r.estado === 'pendiente').length;
    if (nSol || nRes) bell += `<div class="bell">🔔 Tienes ${[nSol ? `<b>${nSol}</b> solicitud${nSol > 1 ? 'es' : ''} de alta` : '', nRes ? `<b>${nRes}</b> resultado${nRes > 1 ? 's' : ''} por validar` : ''].filter(Boolean).join(' y ')}
      <div class="row">${nSol ? '<button class="btn sm" style="background:#fff;color:var(--rose-strong);border:1px solid #f5c6cc" data-act="irAdm" data-v="jugadores">Ver altas</button>' : ''}${nRes ? '<button class="btn sm" style="background:#fff;color:var(--rose-strong);border:1px solid #f5c6cc" data-act="irAdm" data-v="resultados">Ver resultados</button>' : ''}</div></div>`;
  }
  $('ini-bell').innerHTML = bell;

  // Banner última americana
  let b = '';
  jornadasOrd().filter(j => j.ultima && j.estado !== 'cerrada' && cuentaParaRanking(j) && visible(j)).forEach(j => {
    const rk = calcRanking(S.resultados, S.jornadas, j.temporadaId);
    b += `<div class="banner"><b>🏁 ¡Última americana del ranking ${esc(circ(j.circuitoId).nombre)}!</b>${esc(fmtFecha(j))}. Los puntos de ese día cierran la temporada <i>${esc(j.temporadaNombre)}</i>.`;
    if (m){
      const at = aTiro(rk.porPuntos, m.id);
      if (at.arriba.length) b += `<div style="margin-top:8px">🔥 Puedes alcanzar a: ${at.arriba.map(x => `<b style="display:inline">${esc(nom(x.pid))}</b> (${x.dif ? 'a ' + x.dif + ' pts' : 'empatados'})`).join(', ')}</div>`;
      if (at.abajo.length) b += `<div style="margin-top:6px">👀 Te pueden pasar: ${at.abajo.slice(0, 4).map(x => `${esc(nom(x.pid))} (a ${x.dif})`).join(', ')}</div>`;
    } else {
      const duelos = [];
      rk.porPuntos.slice(0, 6).forEach((s, i, a) => { if (i && s.distAnterior <= MAX_PTS_JORNADA) duelos.push(`${esc(nom(a[i - 1].pid))} vs ${esc(nom(s.pid))} (${s.distAnterior} pts)`); });
      if (duelos.length) b += `<div style="margin-top:8px">🔥 Duelos ajustados: ${duelos.join(' · ')}</div>`;
    }
    b += `</div>`;
  });
  $('ini-banner').innerHTML = b;

  // Americanas abiertas
  let h = '';
  const prox = jornadasOrd().filter(j => j.estado !== 'cerrada' && visible(j));
  if (!S.loaded.jornadas) h = `<div class="card empty">Cargando…</div>`;
  else if (!prox.length) h = `<div class="card"><h2>Próximas americanas</h2><p class="empty">No hay americanas abiertas ahora mismo.</p></div>`;
  else prox.forEach(j => h += cardJornada(j, m));
  if (!S.user && prox.length) h += `<div class="card center"><p>Entra en <b>👤 Perfil</b> para apuntarte y subir tu resultado.</p></div>`;
  $('ini-jornadas').innerHTML = h;

  // Top de cada circuito con ranking
  let tp = '';
  circsConRanking().forEach(c => {
    if (!visibleCirc(c)) return;
    const t = tempActual(c.id); if (!t) return;
    const rk = calcRanking(S.resultados, S.jornadas, t.id);
    const modo = c.tipoRanking === 'puntos' ? 'puntos' : 'asistencia';
    const lista = modo === 'puntos' ? rk.porPuntos : rk.porAsistencia;
    if (!lista.length) return;
    tp += `<div class="card"><h2>${esc(c.emoji || '')} Top 5 ${esc(c.nombre)} · ${esc(t.nombre)}</h2>${lista.slice(0, 5).map(s => rankRow(s, modo, m, t.id)).join('')}
      <button class="btn sec" data-act="verRanking" data-c="${c.id}">Ver ranking completo</button></div>`;

}
function visibleCirc(c){ if (S.isAdmin && !S.asPid) return true; if (c.acceso !== 'marcados') return true; const m = me(); return !!m && (m.circuitos || []).includes(c.id); }

function cardJornada(j, m){
  const c = circ(j.circuitoId), P = plazasDe(j);
  const ins = activos(j.id);
  const miIdx = m ? ins.findIndex(i => i.id === m.id) : -1;
  let h = `<div class="card"><div style="margin-bottom:6px">${circChip(j.circuitoId)} ${j.amistosa ? '<span class="chip">🤝 Amistosa</span>' : ''} ${j.ultima ? '<span class="chip peach">🏁 Última del ranking</span>' : ''}</div>
    <div style="font-weight:800;font-size:1.1rem">${esc(fmtFecha(j))}</div>
    <div style="margin:6px 0">${estadoChip(j.estado)}</div>
    <div class="counter"><span class="big">${P.total}</span> apuntados · <b>${P.pistas}</b> pista${P.pistas === 1 ? '' : 's'}${P.espera.length ? ` · ${P.espera.length} en espera` : ''}
      ${j.estado === 'abierta' && !P.lleno ? `<div class="small" style="margin-top:4px">${P.faltanMin ? `🙏 Faltan <b>${P.faltanMin}</b> para llegar al mínimo (${j.minPistas || 4} pistas)` : `🎾 ¡Faltan <b>${P.faltanOtra}</b> para abrir otra pista! Si conoces a alguien, que se apunte`}</div>` : ''}
      ${P.lleno ? '<div class="small" style="margin-top:4px">✅ Completo. Si te apuntas, entras en lista de espera.</div>' : ''}</div>`;
  if (m && j.estado === 'abierta' && !puedeCirc(m, j.circuitoId)) h += `<p class="muted">Este circuito es solo para jugadoras invitadas.</p>`;
  else if (m && j.estado !== 'cerrada'){
    if (miIdx >= 0){
      const mi = ins[miIdx];
      const enEspera = P.espera.some(x => x.id === m.id), reserva = P.reservas.some(x => x.id === m.id);
      h += `<div class="alert">${enEspera ? `⏳ Estás en <b>lista de espera</b> (nº ${P.espera.findIndex(x => x.id === m.id) + 1}).` : reserva ? '✅ Estás apuntado/a. Ahora mismo <b>sobras</b> para completar pista: si se apunta alguien más, entras seguro.' : '✅ Estás apuntado/a.'}${mi.parejaId ? ' Con ' + esc(nom(mi.parejaId)) + '.' : ''}</div>`;
      const tarde = horasPara(j) < 24;
      h += `<button class="btn rose" data-act="desapuntarme" data-j="${j.id}">${tarde ? '⏰ No puedo ir (baja de última hora)' : 'Desapuntarme'}</button>`;
      if (!tarde) h += `<p class="muted small" style="margin-top:6px">Si no puedes venir, desapúntate con al menos 24 h de antelación para que Luz pueda buscar sustituto.</p>`;
    } else if (j.estado === 'abierta'){
      h += `<label>¿Vienes con pareja fija? (opcional)</label>
        <select id="ins-pareja-${j.id}"><option value="">Sin pareja fija</option>${jugadoresActivos().filter(p => p.id !== m.id && puedeCirc(p, j.circuitoId)).map(p => `<option value="${p.id}">${esc(p.nombre)}</option>`).join('')}</select>
        <button class="btn mint" data-act="apuntarme" data-j="${j.id}">✋ ${P.lleno ? 'Apuntarme a la lista de espera' : 'Me apunto'}</button>`;
    }
  }
  // Mi pista
  if (m && j.pistas){
    const k = j.pistas.findIndex(p => [p.a1, p.a2, p.b1, p.b2].includes(m.id));
    if (k >= 0){ const p = j.pistas[k]; const comp = p.a1 === m.id ? p.a2 : p.a2 === m.id ? p.a1 : p.b1 === m.id ? p.b2 : p.b1;
      const riv = [p.a1, p.a2].includes(m.id) ? [p.b1, p.b2] : [p.a1, p.a2];
      h += `<div class="alert">🎾 Empiezas en la <b>pista ${k + 1}</b> con ${esc(nom(comp))} contra ${esc(nom(riv[0]))} y ${esc(nom(riv[1]))}.</div>`; }
  }
  // Resultado (solo circuitos con puntos)
  if (m && cuentaParaRanking(j)){
    const mio = S.resultados.find(x => x.jornadaId === j.id && x.playerId === m.id);
    if (mio){
      const orden = resJ(j.id).findIndex(x => x.id === mio.id) + 1;
      h += `<h3>Resultado del último partido</h3><div class="center" style="font-size:1.1rem;font-weight:700">${RES_TXT[mio.resultado]}</div>
        <p class="center muted" style="margin-top:6px">Enviado a las ${fmtHora(mio.ts)} · ${orden}º en enviarlo<br>
        ${mio.estado === 'aprobado' ? `<span class="chip mint">✓ Validado · +${PTS[mio.resultado]} pts</span>` : '<span class="chip lav">⏳ Pendiente de validar</span>'}</p>`;
    }
  }
  if (ventanaRes(j) && (!m || !S.resultados.some(x => x.jornadaId === j.id && x.playerId === m.id)))
    h += `<button class="cta" data-act="abrirLista" data-j="${j.id}">🏁 APUNTAR RESULTADO DEL ÚLTIMO PARTIDO</button><span class="plazo">${plazoTxt(j)}</span>`;
  if (esHoy(j) && Date.now() < finMs(j) + 3600000)
    h += `<button class="btn" style="background:#0f172a;color:#a3e635;font-size:1.05rem" data-act="abrirCrono" data-j="${j.id}">⏱ CRONÓMETRO · cambios cada ${minRonda(j)}′</button>`;
  h += `<div class="row"><button class="btn sec" data-act="verAmericana" data-j="${j.id}">Ver apuntados y pistas</button><button class="btn wa" data-act="waLista" data-j="${j.id}">📲 Compartir</button></div></div>`;
  return h;
}

function rankRow(s, modo, m, tid){
  const pos = modo === 'puntos' ? s.pos : s.posA;
  const cls = (pos <= 3 ? ' p' + pos : '') + (m && m.id === s.pid ? ' me' : '');
  const conPuntos = modo === 'puntos';
  let sub = conPuntos ? `${s.asist} asist. · ${s.gan}G ${s.per}P` : `${s.asist} americana${s.asist === 1 ? '' : 's'}`;
  const ult = S.jornadas.some(j => j.ultima && j.estado !== 'cerrada' && j.temporadaId === tid);
  if (conPuntos && s.empateGanado) sub += ' · <span class="chip lav">desempate: envió antes</span>';
  if (conPuntos && ult && s.distAnterior != null && s.distAnterior <= MAX_PTS_JORNADA) sub += ` · <span class="chip peach">a ${s.distAnterior} del anterior</span>`;
  return `<div class="rank-row${cls}"><div class="pos">${pos <= 3 ? ['🥇', '🥈', '🥉'][pos - 1] : pos}</div>
    <div class="who"><div class="n">${esc(nom(s.pid))}</div><div class="muted small">${sub}</div></div>
    <div class="pts">${conPuntos ? s.pts : s.asist}</div></div>`;
}

/* ----- Ranking ----- */
function renderRanking(){
  const cs = circsConRanking().filter(visibleCirc);
  if (!S.rankCirc || !cs.some(c => c.id === S.rankCirc)) S.rankCirc = cs[0]?.id || null;
  $('rank-circs').innerHTML = cs.length > 1 ? cs.map(c => `<button data-act="rankCirc" data-v="${c.id}" class="${c.id === S.rankCirc ? 'on' : ''}">${esc(c.emoji || '')} ${esc(c.nombre)}</button>`).join('') : '';
  $('rank-circs').classList.toggle('hidden', cs.length <= 1);
  const c = S.rankCirc ? circ(S.rankCirc) : null;
  const soloAsist = c && c.tipoRanking === 'asistencia';
  $('rank-modes').classList.toggle('hidden', !c || soloAsist);
  const modo = soloAsist ? 'asistencia' : S.rankMode;
  $('seg-puntos').classList.toggle('on', modo === 'puntos');
  $('seg-asistencia').classList.toggle('on', modo === 'asistencia');
  const ts = c ? temporadasDe(c.id) : [];
  if (!S.rankTemp || !ts.some(t => t.id === S.rankTemp)) S.rankTemp = c ? tempActual(c.id)?.id || null : null;
  fillSelect($('rank-temp'), ts.map(t => ({ v: t.id, t: t.nombre + (t.fin >= hoy() ? ' (en curso)' : ' (finalizada)') })));
  $('rank-temp').value = S.rankTemp || '';
  $('rank-temp').classList.toggle('hidden', !ts.length);
  if (!c || !S.rankTemp){ $('rank-list').innerHTML = '<p class="empty">Todavía no hay ranking.</p>'; $('rank-info').textContent = ''; return; }
  const rk = calcRanking(S.resultados, S.jornadas, S.rankTemp);
  const lista = modo === 'puntos' ? rk.porPuntos : rk.porAsistencia;
  const pend = S.resultados.filter(r => r.temporadaId === S.rankTemp && r.estado === 'pendiente').length;
  $('rank-info').innerHTML = (modo === 'puntos'
    ? 'Asistir +5 · Último partido ganado +3 / perdido +1. Empate: gana quien envió antes su resultado.'
    : 'Americanas jugadas en la temporada. ¡Premio a quien más venga!') +
    (pend ? ` <span class="chip lav">${pend} resultado(s) pendientes de validar</span>` : '');
  $('rank-list').innerHTML = lista.length ? lista.map(s => rankRow(s, modo, me(), S.rankTemp)).join('') + `<button class="btn wa" data-act="waRanking" data-m="${modo}">📲 Compartir ranking por WhatsApp</button>` : '<p class="empty">Aún no hay resultados validados.</p>';
}

  if (!j){ $('ame-content').innerHTML = '<div class="card empty">No hay americanas todavía.</div>'; return; }
  subInscritos(j.id);

  }

  if (rs.length && cuentaParaRanking(j)){

      <div>${RES_TXT[r.resultado]} ${r.estado === 'aprobado' ? '<span class="chip mint">✓</span>' : '<span class="chip lav">⏳</span>'}</div></div>`).join('')}</div>`;
  }
  const fila = (i, k, extra) => `<div class="list-item"><div class="row" style="justify-content:flex-start;gap:10px"><span class="num">${k}</span><span class="name">${esc(nom(i.id))}</span></div>${i.parejaId ? `<span class="chip blue">con ${esc(nom(i.parejaId))}</span>` : ''}${extra || ''}</div>`;

    ${P.dentro.length ? P.dentro.map((i, k) => fila(i, k + 1, P.reservas.some(x => x.id === i.id) ? '<span class="chip peach">sobra</span>' : '')).join('') : '<p class="empty">Nadie apuntado todavía.</p>'}
    ${P.espera.length ? `<h3>⏳ Lista de espera</h3>${P.espera.map((i, k) => fila(i, k + 1)).join('')}` : ''}<button class="btn wa" data-act="waLista" data-j="${j.id}">📲 Compartir lista por WhatsApp</button></div>`;
  $('ame-content').innerHTML = h;
}

function courtHTML(p, k, editable, m, activosSet){
  const slot = (key) => {
    const pid = p[key]; const path = `c${k}.${key}`;
    const baja = activosSet && pid && !activosSet.has(pid);
    const lv = editable ? `<span class="lvl">${nivel(pid).toFixed(1)}</span>` : '';
    const cls = 'slot' + (S.sel === path ? ' sel' : '') + (m && m.id === pid ? ' mine' : '') + (baja ? ' hueco' : '');
    const txt = baja ? `⚠️ ${esc(nom(pid))} (baja)` : esc(nom(pid));
    return editable ? `<button class="${cls}" data-act="slot" data-p="${path}">${txt}${lv}</button>` : `<div class="${cls}">${txt}</div>`;
  };
  const media = (a, b) => ((nivel(p[a]) + nivel(p[b])) / 2).toFixed(2);
  return `<div class="court"><div class="t"><span>Pista ${k + 1}</span>${editable ? `<span class="muted small">${media('a1', 'a2')} vs ${media('b1', 'b2')}</span>` : ''}</div>
    <div class="teams"><div>${slot('a1')}${slot('a2')}</div><div class="vs">VS</div><div>${slot('b1')}${slot('b2')}</div></div></div>`;
}

function renderPerfil(){
  const m = me(), u = S.user;

    if (m) h += perfilJugador(m);
  } else if (u && !m){
    if (!S.loaded.players || S.miSolicitud === undefined) h = `<div class="card empty">Cargando…</div>`;
    else if (S.miSolicitud) h = `<div class="card center"><h2>⏳ Alta pendiente</h2><p>Hola ${esc(S.miSolicitud.nombre)}, Luz tiene que aprobar tu alta. En cuanto lo haga podrás apuntarte y subir resultados.</p><button class="btn sec" data-act="logout">Salir</button></div>`;
    else h = `<div class="card center"><h2>Cuenta no activa</h2><p class="muted">Tu alta no está activa. Habla con Luz.</p><button class="btn sec" data-act="logout">Salir</button></div>`;
  } else if (m) h = perfilJugador(m);
  $('perfil-live').innerHTML = h;
}

function perfilJugador(m){
  const mis = S.resultados.filter(r => r.playerId === m.id && r.estado === 'aprobado');
  const gan = mis.filter(r => r.resultado === 'ganado').length, per = mis.filter(r => r.resultado === 'perdido').length;
  let h = `<div class="card"><h2>👤 ${esc(m.nombre)}</h2>`;
  circsConRanking().forEach(c => {
    if (!puedeCirc(m, c.id)) return;
    const t = tempActual(c.id); if (!t) return;
    const s = calcRanking(S.resultados, S.jornadas, t.id)[c.tipoRanking === 'puntos' ? 'porPuntos' : 'porAsistencia'].find(x => x.pid === m.id);
    h += `<h3>${esc(c.emoji || '')} ${esc(c.nombre)} · ${esc(t.nombre)}</h3><div class="stats">
      <div class="stat"><div class="v">${s ? (c.tipoRanking === 'puntos' ? s.pos : s.posA) + 'º' : '—'}</div><div class="l">Posición</div></div>
      ${c.tipoRanking === 'puntos' ? `<div class="stat"><div class="v">${s ? s.pts : 0}</div><div class="l">Puntos</div></div>` : ''}
      <div class="stat"><div class="v">${s ? s.asist : 0}</div><div class="l">Asistencias</div></div></div>`;
  });
  h += `<h3>Histórico total</h3><div class="stats"><div class="stat"><div class="v">${mis.length}</div><div class="l">Americanas</div></div><div class="stat"><div class="v">${gan}/${per}</div><div class="l">Ganados/Perdidos</div></div><div class="stat"><div class="v">${gan + per ? Math.round(gan * 100 / (gan + per)) : 0}%</div><div class="l">Victorias</div></div></div></div>`;
  const jById = Object.fromEntries(S.jornadas.map(j => [j.id, j]));
  const hist = S.resultados.filter(r => r.playerId === m.id && jById[r.jornadaId]).sort((a, b) => jornadaKey(jById[b.jornadaId]).localeCompare(jornadaKey(jById[a.jornadaId]))).slice(0, 12);
  h += `<div class="card"><h2>Mis americanas</h2>${hist.length ? hist.map(r => `<div class="list-item"><span>${esc(jLabel(jById[r.jornadaId]))}</span><span>${RES_TXT[r.resultado]} ${r.estado === 'aprobado' ? (cuentaParaRanking(jById[r.jornadaId]) ? `<span class="chip mint">+${PTS[r.resultado]}</span>` : '<span class="chip mint">✓</span>') : '<span class="chip lav">⏳</span>'}</span></div>`).join('') : '<p class="empty">Todavía no has jugado ninguna.</p>'}
    ${S.isAdmin ? '' : '<button class="btn sec" data-act="logout">Cerrar sesión</button>'}</div>`;
  return h;
}

const bajasPend = () => S.bajas.filter(b => !b.visto && S.jornadas.some(j => j.id === b.jornadaId && j.estado !== 'cerrada'));
function nAvisos(){ return bajasPend().length + S.solicitudes.length + Object.keys(pendJ()).length; }
const FLUJO = j => cuentaParaRanking(j) ? ['abierta', 'en_juego', 'resultados', 'cerrada'] : ['abierta', 'en_juego', 'cerrada'];
const PASO_TXT = { abierta: 'Inscripción', en_juego: 'Jugando', resultados: 'Resultados', cerrada: 'Cerrada' };
function siguientePaso(j){
  if (j.estado === 'abierta') return ['en_juego', '▶ Empezar a jugar'];

function historialHTML(ant, card){
  if (!ant.length) return '';
  const meses = {}; ant.forEach(j => (meses[j.fecha.slice(0, 7)] = meses[j.fecha.slice(0, 7)] || []).push(j));
  const keys = Object.keys(meses).sort().reverse();
  if (S.mesAbierto === undefined) S.mesAbierto = keys[0];
  return `<div class="sec-t">📚 Historial</div>` + keys.map(k => {
    const js = meses[k], nombre = new Date(k + '-15T12:00').toLocaleDateString('es-ES', { month: 'long', year: 'numeric' });
    const jug = js.reduce((a, j) => a + resJ(j.id).length, 0), open = S.mesAbierto === k;
    return `<button class="jc" style="justify-content:space-between" data-act="mes" data-m="${k}"><span class="i"><span class="n" style="display:block;font-size:1.08rem">${esc(nombre.charAt(0).toUpperCase() + nombre.slice(1))}</span><span class="muted">${js.length} americana${js.length === 1 ? '' : 's'}${jug ? ' · ' + jug + ' jugadores' : ''}</span></span><span class="ar">${open ? '▾' : '›'}</span></button>`
      + (open ? `<div style="margin:-2px 0 10px 12px">${js.map(card).join('')}</div>` : '');
  }).join('');
}

function fichaHTML(j){
  const flujo = FLUJO(j), idx = flujo.indexOf(j.estado), sig = siguientePaso(j);
  let h = `<div class="dethd"><button class="bk" data-act="cerrarDet">‹</button><div class="tt"><b>${esc(fmtFecha(j, false))} · ${esc(hhmm(inicioMs(j)))}</b><small>${esc(circ(j.circuitoId).emoji || '')} ${esc(circ(j.circuitoId).nombre)}${j.temporadaNombre ? ' · ' + esc(j.temporadaNombre) : ' · 🤝 amistosa'}${j.ultima ? ' · 🏁 última' : ''}</small></div><button class="mn" data-act="modal" data-t="ajustes">⋮</button></div>
    <div class="steps">${flujo.map((e, k) => `<div class="${k < idx ? 'done' : k === idx ? 'now' : ''}"><i></i>${PASO_TXT[e]}</div>`).join('')}</div>`;
  if (sig) h += `<button class="btn" style="font-size:1.08rem;padding:15px" data-act="setEstado" data-e="${sig[0]}">${sig[1]}</button>`;
  else {
    const rs = resJ(j.id), g = rs.filter(r => r.resultado === 'ganado').length, pe = rs.filter(r => r.resultado === 'perdido').length;
    h += `<div class="card" style="margin-top:8px"><h2>📋 Resumen</h2><p style="font-weight:800;font-size:1.05rem">${rs.length} jugadores${j.pistas?.length ? ' · ' + j.pistas.length + (j.pistas.length === 1 ? ' pista' : ' pistas') : ''}${cuentaParaRanking(j) ? `<br>🏆 ${g} ganaron · 🤝 ${pe} perdieron` : ''}</p>
      ${j.cerradaAuto ? '<p class="muted small">Cerrada automáticamente a las 48 h.</p>' : ''}${cuentaParaRanking(j) && rs.length ? `<button class="btn wa" data-act="waResDia" data-j="${j.id}">📲 Compartir resultados</button>` : ''}
      <p class="muted small" style="margin-top:6px">🔒 Cerrada. Para reabrirla, usa ⋮.</p></div>`;
  }
  if (esHoy(j) && j.estado !== 'cerrada') h += `<button class="btn" style="background:#0f172a;color:#a3e635;font-size:1.1rem;padding:15px" data-act="abrirCrono" data-j="${j.id}">⏱ ABRIR CRONÓMETRO</button>`;
  const P = plazasDe(j), pend = resJ(j.id).filter(r => r.estado === 'pendiente').length;
  h += `<div class="dtabs">
    <button class="${S.detTab === 'apuntados' ? 'on' : ''}" data-act="detTab" data-v="apuntados">👥 Apuntados ${P.total}</button>
    <button class="${S.detTab === 'pistas' ? 'on' : ''}" data-act="detTab" data-v="pistas">🎾 Pistas</button>
    <button class="${S.detTab === 'resultados' ? 'on' : ''}" data-act="detTab" data-v="resultados">✅ ${usaLista(j) ? 'Lista' : 'Result.'}${pend ? ' (' + pend + ')' : ''}</button></div>`;
  if (S.detTab === 'pistas') h += pistasHTML(j);
  else if (S.detTab === 'resultados') h += resultadosHTML(j);
  else h += apuntadosHTML(j);
  return h + '<div style="height:20px"></div>';
}

function apuntadosHTML(j){
  const P = plazasDe(j);
  if (j.estado === 'cerrada'){
    const rs = resJ(j.id);
    return `<div class="card" style="padding:4px 12px">${rs.length ? rs.map((r, k) => `<div class="pl2"><span class="num">${k + 1}</span><div class="nm">${esc(nom(r.playerId))}<small>${RES_TXT[r.resultado]}${r.estado === 'pendiente' ? ' · ⏳ sin validar' : ''}</small></div></div>`).join('') : '<p class="empty">No hay asistentes registrados.</p>'}</div>`;
  }
  let h = `<div class="counter"><span class="big">${P.total}</span> apuntados → <b>${P.pistas} pista${P.pistas === 1 ? '' : 's'}</b>${P.sobran ? ` + ${P.sobran}` : ''}${P.espera.length ? ` · ${P.espera.length} en espera` : ''}
    <div class="small" style="margin-top:4px">${P.faltanMin ? `⚠️ Faltan <b>${P.faltanMin}</b> para el mínimo (${j.minPistas || 4} pistas)` : P.lleno ? '✅ Completo' : `🎾 Faltan <b>${P.faltanOtra}</b> para la ${P.pistas + 1}ª pista`}</div></div>`;
  const bj = S.bajas.filter(b => b.jornadaId === j.id && !b.visto);
  if (bj.length) h += `<div class="alarm" style="padding:12px"><b>⚠️ Bajas sin resolver</b>${bj.map(b => `<div class="it"><div class="n" style="font-size:1rem">${esc(nom(b.playerId))} ${b.tardia ? '<span class="tardia">⏰ última hora</span>' : ''}</div><div class="small">${hace(b.ts)}</div>
    <div class="row" style="margin-top:6px"><button class="btn sm rose" data-act="buscarSust" data-j="${j.id}" data-p="${b.playerId}" data-b="${b.id}">🔄 Sustituir</button><button class="btn sm sec" data-act="bajaVista" data-b="${b.id}">✓ Visto</button></div></div>`).join('')}</div>`;
  const fila = (i, k, tag) => `<div class="pl2"><span class="num">${k}</span><div class="nm">${esc(nom(i.id))} ${tag || ''}<small>nivel ${nivel(i.id).toFixed(1)}${i.parejaId ? ' · con ' + esc(nom(i.parejaId)) + (activos(j.id).some(x => x.id === i.parejaId) ? '' : ' (no apuntada)') : ''}${i.por === 'admin' ? ' · apuntado por ti' : ''}</small></div><button class="dots" data-act="modal" data-t="ins" data-p="${i.id}">⋯</button></div>`;
  h += `<div class="card" style="padding:4px 12px">${P.dentro.length ? P.dentro.map((i, k) => fila(i, k + 1, P.reservas.some(x => x.id === i.id) ? '<span class="chip peach">sobra</span>' : '')).join('') : '<p class="empty">Nadie apuntado todavía.</p>'}</div>`;
  if (P.espera.length) h += `<div class="sec-t">⏳ Lista de espera</div><div class="card" style="padding:4px 12px">${P.espera.map((i, k) => fila(i, 'E' + (k + 1))).join('')}</div>`;
  h += `<div class="row"><button class="btn mint" data-act="modal" data-t="apuntar">＋ Apuntar</button><button class="btn wa" data-act="waLista" data-j="${j.id}">📲 Lista</button></div>`;
  return h;
}

function pistasHTML(j){
  const P = plazasDe(j), ids = new Set(activos(j.id).map(i => i.id));
  let pz = '';
  if (S.draft && S.draft.jid === j.id){
    pz += `<div class="alert">✏️ Toca un jugador y luego otro para intercambiarlos (también con reservas).</div><div style="margin-top:10px">`;
    pz += S.draft.pistas.map((p, k) => courtHTML(p, k, true, null, null)).join('') + '</div>';
    if (S.draft.reservas.length) pz += `<h3>Reservas / sin pista</h3>` + S.draft.reservas.map((pid, i) => `<button class="slot${S.sel === 'r' + i ? ' sel' : ''}" data-act="slot" data-p="r${i}">${esc(nom(pid))}<span class="lvl">${nivel(pid).toFixed(1)}</span></button>`).join('');
    pz += `<div class="row"><button class="btn mint" data-act="guardarPistas">💾 Guardar pistas</button><button class="btn sec" data-act="descartarDraft">Descartar</button></div>`;
  } else {
    if (j.pistas?.length) pz += j.pistas.map((p, k) => courtHTML(p, k, false, null, ids)).join('') + (j.reservas?.length ? `<p class="muted small">Reservas: ${j.reservas.map(nom).map(esc).join(', ')}</p>` : '');
    else pz += `<div class="card"><p>Juegan los <b>${P.juegan.length}</b> primeros en apuntarse (${P.pistas} pistas).${P.reservas.length + P.espera.length ? ` Los ${P.reservas.length + P.espera.length} últimos quedan de reserva.` : ''}</p></div>`;
    if (j.pistas?.length) pz += `<div class="row"><button class="btn sec" data-act="editarPistas">✏️ Cambiar</button><button class="btn wa" data-act="waPistas" data-j="${j.id}">📲 Pistas</button></div>`;
    pz += `<button class="btn ${j.pistas?.length ? 'sec' : ''}" data-act="generar" ${P.juegan.length < 4 ? 'disabled' : ''}>🎾 ${j.pistas?.length ? 'Volver a generar por nivel' : 'Generar primer partido por nivel'}</button>`;
  }
  return pz;
}

function resultadosHTML(j){
  const rs = resJ(j.id);
  if (usaLista(j)){
    if (!S.lista || S.lista.jid !== j.id){
      const sel = new Set(rs.map(r => r.playerId));
      if (!sel.size) activos(j.id).forEach(i => sel.add(i.id));
      S.lista = { jid: j.id, sel, extra: new Set() };
    }
    const ids = [...new Set([...activos(j.id).map(i => i.id), ...rs.map(r => r.playerId), ...S.lista.extra])];
    let h = `<div class="card"><p style="margin-bottom:6px">📋 <b>Pasar lista:</b> marca quién ha venido. ${rs.length ? `<span class="chip mint">Guardada: ${rs.length}</span>` : '<span class="chip lav">Sin guardar</span>'}</p>`;
    h += ids.map(pid => `<label class="checkrow"><input type="checkbox" data-act-change="lista" value="${pid}"${S.lista.sel.has(pid) ? ' checked' : ''}> <span class="name">${esc(nom(pid))}</span></label>`).join('') || '<p class="empty">No hay nadie apuntado.</p>';
    h += `<label>¿Vino alguien sin apuntarse?</label><select id="lista-extra"><option value="">— Añadir jugador —</option>${jugadoresActivos().filter(p => !ids.includes(p.id)).map(p => `<option value="${p.id}">${esc(p.nombre)}</option>`).join('')}</select>
      <button class="btn mint" data-act="guardarLista">💾 Guardar asistencia (${S.lista.sel.size})</button></div>`;
    return h;
  }
  const pend = rs.filter(r => r.estado === 'pendiente'), ok = rs.filter(r => r.estado === 'aprobado');
  const sinRes = activos(j.id).filter(i => !rs.some(r => r.playerId === i.id));
  let h = `<div class="card"><h2>${rs.length} de ${activos(j.id).length} enviados</h2>`;
  h += pend.length ? `<button class="cta" data-act="aprobarTodos">✓ VALIDAR LOS ${pend.length}</button>` + pend.map(r => `<div class="pl2"><span class="num">${rs.indexOf(r) + 1}</span><div class="nm">${esc(nom(r.playerId))}<small>${RES_TXT[r.resultado]} · ${fmtHora(r.ts)}</small></div><button class="btn sm mint" data-act="aprobar" data-id="${r.id}">✓</button><button class="btn sm rose" data-act="borrarRes" data-id="${r.id}">✕</button></div>`).join('') : '<p class="muted">Nada pendiente de validar.</p>';
  if (sinRes.length && ventanaRes(j)) h += `<span class="plazo">${plazoTxt(j).replace('Tienes', 'Tienen')}</span><button class="btn wa" data-act="waRecordar" data-j="${j.id}">📲 Recordar a los ${sinRes.length} que faltan</button>`;
  if (sinRes.length) h += `<div class="sec-t">Faltan (${sinRes.length}) · pónselo tú</div>` + sinRes.map(i => `<div class="pl2"><div class="nm">${esc(nom(i.id))}</div><button class="btn sm mint" data-act="adminRes" data-p="${i.id}" data-r="ganado">Ganó</button><button class="btn sm sec" data-act="adminRes" data-p="${i.id}" data-r="perdido">Perdió</button></div>`).join('');
  h += `<button class="btn sec" data-act="modal" data-t="resLibre">＋ Resultado de alguien no apuntado</button></div>`;
  if (ok.length) h += `<div class="sec-t">✅ Validados (${ok.length})</div><div class="card" style="padding:4px 12px">` + ok.map(r => `<div class="pl2"><span class="num">${rs.indexOf(r) + 1}</span><div class="nm">${esc(nom(r.playerId))}<small>+${PTS[r.resultado]} · ${fmtHora(r.ts)}${r.por === 'admin' ? ' · puesto por ti' : ''}</small></div>
      <select data-act-change="cambiarRes" data-id="${r.id}" style="width:auto;padding:6px"><option value="ganado"${r.resultado === 'ganado' ? ' selected' : ''}>Ganó</option><option value="perdido"${r.resultado === 'perdido' ? ' selected' : ''}>Perdió</option><option value="asistencia"${r.resultado === 'asistencia' ? ' selected' : ''}>Asistió</option></select>
      <button class="btn sm rose" data-act="borrarRes" data-id="${r.id}">✕</button></div>`).join('') + '</div>';
  if (j.temporadaId){
    const rk = calcRanking(S.resultados, S.jornadas, j.temporadaId).porPuntos.slice(0, 3);
    if (rk.length) h += `<div class="card"><h2>🏆 Top 3 · ${esc(j.temporadaNombre || '')}</h2>` + rk.map(x => rankRow(x, 'puntos', null, j.temporadaId)).join('') + `<button class="btn wa" data-act="waTop" data-c="${j.circuitoId}" data-t="${j.temporadaId}">📲 Compartir ranking</button></div>`;
  }
  return h;
}

/* ----- Jugadores ----- */
function parecidos(nombre){
  const w = normTxt(nombre).split(' ').filter(x => x.length > 1);
  if (!w.length) return [];
  return jugadoresActivos().filter(p => { const pw = normTxt(p.nombre).split(' '); return pw[0] === w[0] || w.filter(x => pw.includes(x)).length >= 2; });
}
function tardiasDe(){ const t = {}; S.bajas.filter(b => b.tardia).forEach(b => t[b.playerId] = (t[b.playerId] || 0) + 1); return t; }
function renderAdmJugadores(){
  const tardias = tardiasDe();
  const q = normTxt($('adm-buscar').value);
  const todos = Object.values(S.players).sort((a, b) => (a.estado === 'baja') - (b.estado === 'baja') || a.nombre.localeCompare(b.nombre, 'es'));
  const marcados = S.circuitos.filter(c => c.acceso === 'marcados');
  $('adm-njug').textContent = jugadoresActivos().length;
  $('adm-jugs').innerHTML = todos.filter(p => normTxt(p.nombre).includes(q) || (q && telDe(p.id).includes(q))).map(p => {
    const circs = marcados.filter(c => (p.circuitos || []).includes(c.id)).map(c => (c.emoji || '') + ' ' + c.nombre).join(' · ');
    return `<div class="pl2" data-act="editJug" data-p="${p.id}" style="cursor:pointer${p.estado === 'baja' ? ';opacity:.5' : ''}"><div class="nm">${esc(p.nombre)}<small>${nivel(p.id).toFixed(1)} · ${p.uid ? '📱 usa la app' : S.priv[p.id]?.telefono ? '📞 ' + esc(S.priv[p.id].telefono) : '<span style="color:var(--peach-strong)">sin teléfono</span>'}${circs ? ' · ' + esc(circs) : ''}${tardias[p.id] ? ` · <span style="color:var(--rose-strong)">⏰ ${tardias[p.id]} baja${tardias[p.id] > 1 ? 's' : ''} tardía${tardias[p.id] > 1 ? 's' : ''}</span>` : ''}${p.estado === 'baja' ? ' · de baja' : ''}</small></div><span style="font-size:1.4rem;color:var(--muted)">›</span></div>`;
  }).join('') || '<p class="empty">Sin jugadores.</p>';
  $('adm-import').innerHTML = S.loaded.players && !Object.keys(S.players).length
    ? `<button class="btn peach" data-act="importar">📥 Importar mis ${LISTA_INICIAL.length} jugadores de la versión anterior</button>` : '';
}

/* ----- Circuitos ----- */
function formCirc(c){
  const sel = (id, opts, v) => `<select id="${id}">${Object.entries(opts).map(([k, t]) => `<option value="${k}"${k === v ? ' selected' : ''}>${esc(t)}</option>`).join('')}</select>`;
  return `<div class="box">
    <div class="row"><div style="flex:0 0 5rem"><label>Emoji</label><input id="ec-emoji" value="${esc(c.emoji || '🎾')}" maxlength="4"></div><div><label>Nombre</label><input id="ec-nombre" value="${esc(c.nombre || '')}" placeholder="Ej: Mixta de los viernes"></div></div>
    <label>Tipo de ranking</label>${sel('ec-tipo', TIPOS, c.tipoRanking || 'puntos')}
    <label>Duración de cada temporada</label>${sel('ec-dur', DURS, c.duracion || '2m')}
    <label>¿Quién puede apuntarse?</label>${sel('ec-acc', { todos: 'Todos los jugadores', marcados: 'Solo los que yo marque' }, c.acceso || 'todos')}
    <div class="row"><div><label>Mín. pistas</label><input id="ec-min" type="number" min="1" max="20" value="${c.minPistas || 4}"></div><div><label>Máx. pistas</label><input id="ec-max" type="number" min="1" max="20" value="${c.maxPistas || 8}"></div></div>
    <p class="muted small" style="margin-top:6px">Los cambios de duración se aplican a las americanas que crees a partir de ahora.</p>
    <div class="row"><button class="btn mint" data-act="guardarCirc" data-id="${c.id || ''}">💾 Guardar</button><button class="btn sec" data-act="editCirc" data-id="">Cancelar</button></div></div>`;
}
function renderAdmCircuitos(){
  let h = '';
  S.circuitos.forEach(c => {
    h += `<div class="card"><h2>${esc(c.emoji || '')} ${esc(c.nombre)}</h2>
      <p class="muted small">${esc(TIPOS[c.tipoRanking] || '')} · ${esc(DURS[c.duracion] || '')} · ${c.acceso === 'marcados' ? 'solo marcados' : 'abierto a todos'} · pistas ${c.minPistas || 4}–${c.maxPistas || 8}</p>`;
    h += S.editCirc === c.id ? formCirc(c) : `<button class="btn sm sec" style="margin-top:8px" data-act="editCirc" data-id="${c.id}">✏️ Editar circuito</button>`;
    const ts = temporadasDe(c.id);
    if (ts.length){
      h += `<h3>Temporadas</h3>` + ts.map(t => {
        const nj = S.jornadas.filter(j => j.temporadaId === t.id).length;
        const rk = calcRanking(S.resultados, S.jornadas, t.id);
        const lp = rk.porPuntos[0], la = rk.porAsistencia[0];
        return `<div class="list-item" style="flex-wrap:wrap"><div style="flex:1"><div class="name">${esc(t.nombre)} ${t.fin >= hoy() ? '<span class="chip mint">En curso</span>' : '<span class="chip">Finalizada</span>'}</div>
          <div class="muted small">${nj} americana${nj === 1 ? '' : 's'} · termina ${esc(t.fin)}</div>
          <div class="small">${c.tipoRanking === 'puntos' ? `🏆 ${lp ? esc(nom(lp.pid)) + ' (' + lp.pts + ')' : '—'} · ` : ''}📅 ${la ? esc(nom(la.pid)) + ' (' + la.asist + ')' : '—'}</div></div>
          <button class="btn sm rose" data-act="borrarTemp" data-id="${t.id}">🗑️</button></div>`;
      }).join('');
    } else h += `<p class="muted small" style="margin-top:8px">Aún no tiene americanas. La temporada se crea sola al crear la primera.</p>`;
    h += `</div>`;
  });
  h += `<div class="card"><h2>➕ Nuevo circuito</h2>${S.editCirc === 'nuevo' ? formCirc({}) : '<button class="btn sec" data-act="editCirc" data-id="nuevo">Crear un circuito nuevo</button>'}</div>`;
  $('adm-circs').innerHTML = h;
}
function fillChecks(cont, prefix, marcadosIds = []){
  const marcados = S.circuitos.filter(c => c.acceso === 'marcados');
  cont.innerHTML = marcados.length ? `<label>Circuitos a los que puede apuntarse</label>` + marcados.map(c => `<label class="checkrow"><input type="checkbox" class="${prefix}" value="${c.id}"${marcadosIds.includes(c.id) ? ' checked' : ''}> ${esc(c.emoji || '')} ${esc(c.nombre)}</label>`).join('') : '';
}

function renderSheetList(){

/* ---------- CRONÓMETRO ---------- */
let audioCtx = null, wakeLock = null, cronoTimer = null, cronoIdx = null, tiempoHasta = 0;
function beep(f, t0, dur, vol = 0.7){
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = 'square'; o.frequency.value = f; o.connect(g); g.connect(audioCtx.destination);
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
  g.gain.setValueAtTime(vol, t0 + dur - 0.05); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
function pitidos(final = false){
  try { navigator.vibrate?.(final ? [600, 200, 600, 200, 1200] : [400, 200, 400, 200, 400]); } catch (e){}
  if (!audioCtx || audioCtx.state !== 'running') return;
  const t = audioCtx.currentTime + 0.05;
  [0, 0.55, 1.1].forEach(d => beep(1000, t + d, 0.4));
  if (final) beep(700, t + 1.7, 1.4);
}
async function activarSonido(){
  try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); await audioCtx.resume(); beep(1000, audioCtx.currentTime + 0.05, 0.15, 0.4); } catch (e){ toast('Este móvil no deja reproducir sonido'); }
  pintarCrono();
}
async function pedirWake(){ try { if ('wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } } catch (e){} }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.crono) pedirWake(); });
function abrirCrono(jid){
  S.crono = jid; cronoIdx = null; tiempoHasta = 0;
  let claro = false; try { claro = localStorage.getItem('crono-claro') === '1'; } catch (e){}
  const c = $('crono'); c.classList.remove('hidden'); c.classList.toggle('claro', claro);
  c.innerHTML = `<div class="in">
    <div class="top"><button data-act="cronoTema">${claro ? '🌙 Oscuro' : '☀️ Claro'}</button><button data-act="cerrarCrono">✕ Cerrar</button></div>
    <div class="tit" id="cr-tit"></div><div id="cr-tiempo"></div>
    <div class="rd" id="cr-rd"></div><div class="clk" id="cr-clk">--:--</div><div class="nx" id="cr-nx"></div>
    <div class="bar"><i id="cr-bar"></i></div>
    <div id="cr-snd"></div><div id="cr-adm"></div><div class="lst" id="cr-lst"></div>
    <p style="margin-top:14px;font-size:.9rem;color:var(--cm)">Deja esta pantalla abierta: el móvil no se apagará y sonarán 3 pitidos en cada cambio.</p></div>`;
  pedirWake(); clearInterval(cronoTimer); cronoTimer = setInterval(tickCrono, 250); tickCrono();
}
function cerrarCrono(){ S.crono = null; clearInterval(cronoTimer); $('crono').classList.add('hidden'); $('crono').innerHTML = ''; try { wakeLock?.release(); } catch (e){} wakeLock = null; }
function tickCrono(){
  const j = S.jornadas.find(x => x.id === S.crono); if (!j) return cerrarCrono();
  const ini = inicioMs(j), R = nRondas(j), D = minRonda(j) * 60000, now = Date.now();
  const idx = now < ini ? -1 : Math.min(R, Math.floor((now - ini) / D));   // -1 antes, 0..R-1 jugando, R fin
  if (cronoIdx !== null && idx > cronoIdx && idx >= 1){ pitidos(idx >= R); tiempoHasta = now + 20000; }
  cronoIdx = idx;
  const mmss = ms => { const t = Math.max(0, Math.ceil(ms / 1000)); return String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0'); };
  $('cr-tit').textContent = jLabel(j) + ' · ' + hhmm(ini) + '–' + hhmm(finMs(j));
  $('cr-tiempo').innerHTML = now < tiempoHasta ? `<div class="tiempo">⏰ ¡TIEMPO!<div style="font-size:1.1rem">${idx >= R ? 'Fin de la americana' : 'Cambio de pista · empieza la ronda ' + (idx + 1)}</div></div>` : '';
  if (idx < 0){
    $('cr-rd').textContent = 'EMPIEZA A LAS ' + hhmm(ini);
    $('cr-clk').textContent = (ini - now) > 3600000 ? hhmm(ini) : mmss(ini - now);
    $('cr-nx').textContent = 'Primer pitido a las ' + hhmm(ini + D); $('cr-bar').style.width = '0%';
  } else if (idx >= R){
    $('cr-rd').textContent = '🏁 ¡FIN DE LA AMERICANA!'; $('cr-clk').textContent = '00:00'; $('cr-nx').textContent = 'Ahora: apuntar el resultado del último partido'; $('cr-bar').style.width = '100%';
  } else {
    const fin = ini + (idx + 1) * D;
    $('cr-rd').textContent = `RONDA ${idx + 1} DE ${R}${idx + 1 === R ? ' · ¡ÚLTIMA!' : ''}`;
    $('cr-clk').textContent = mmss(fin - now);
    $('cr-nx').textContent = (idx + 1 === R ? 'Final a las ' : 'Próximo cambio a las ') + hhmm(fin);
    $('cr-bar').style.width = (100 * (now - ini) / (R * D)).toFixed(1) + '%';
  }
  $('cr-lst').innerHTML = Array.from({ length: R }, (_, k) => `<div class="${k < idx ? 'done' : k === idx ? 'now' : ''}"><span>Ronda ${k + 1}</span><span>${hhmm(ini + k * D)} – ${hhmm(ini + (k + 1) * D)}</span></div>`).join('');
  if (!$('cr-snd').dataset.st || $('cr-snd').dataset.st !== String(audioCtx?.state)) pintarCrono();
  const adm = S.isAdmin && !S.asPid ? 'si' : 'no';
  if ($('cr-adm').dataset.v !== adm + (j.ajusteMin || 0) + j.estado){
    $('cr-adm').dataset.v = adm + (j.ajusteMin || 0) + j.estado;
    $('cr-adm').innerHTML = adm === 'si' ? `<div class="adj"><span style="font-weight:700">¿Empezáis tarde? Mover todo:</span><button data-act="cronoAjuste" data-v="-1">−1′</button><button data-act="cronoAjuste" data-v="1">+1′</button></div>
      ${(j.ajusteMin || 0) ? `<p style="color:var(--cm);margin-top:6px">Movido ${j.ajusteMin > 0 ? '+' : ''}${j.ajusteMin} min</p>` : ''}
      ${cuentaParaRanking(j) && ['abierta', 'en_juego'].includes(j.estado) ? '<button class="bt" style="background:#10b981;color:#fff" data-act="cronoTerminar">🏁 TERMINADA: PEDIR RESULTADOS</button>' : ''}` : '';
  }
}
function pintarCrono(){
  const el = $('cr-snd'); if (!el) return;
  const st = String(audioCtx?.state); el.dataset.st = st;
  el.innerHTML = st === 'running' ? `<button class="bt ok" data-act="cronoProbar">🔊 Sonido activado ✓ · Probar pitido</button>` : `<button class="bt snd" data-act="cronoSonido">🔊 TOCA AQUÍ PARA ACTIVAR EL SONIDO</button>`;
}

  async crearJornada(){
    const cid = $('nj-circ').value; if (!cid) return toast('Elige el circuito');
    const c = circ(cid), hora = $('nj-hora').value;
    const fechas = fechasNueva(); if (!fechas.length) return toast('Elige la fecha');
    const amistosa = $('nj-amistosa').checked;
    const minP = parseInt($('nj-min').value) || c.minPistas || 4, maxP = parseInt($('nj-max').value) || c.maxPistas || 8;
    const rondas = parseInt($('nj-rondas').value) || 6, minR = parseInt($('nj-minr').value) || 20;
    if (minP > maxP) return toast('El mínimo no puede ser mayor que el máximo');
    const ya = fechas.filter(f => S.jornadas.some(j => j.fecha === f && j.circuitoId === cid));
    if (ya.length && !confirm(`Ya hay americana de ${c.nombre} el ${ya.join(', ')}. ¿Crear igualmente?`)) return;
    try {
      const b = writeBatch(db); const ids = [];
      fechas.forEach((fecha, k) => {
        const p = periodo(c.duracion || '2m', fecha), ref = doc(collection(db, 'jornadas')); ids.push(ref.id);
        b.set(ref, {
          fecha, hora, circuitoId: cid, acceso: c.acceso || 'todos', amistosa, ultima: !amistosa && fechas.length === 1 && $('nj-ultima').checked, estado: 'abierta',
          temporadaId: amistosa ? null : `${cid}_${p.key}`, temporadaNombre: amistosa ? '' : p.nombre, temporadaFin: amistosa ? '' : p.fin,
          minPistas: minP, maxPistas: maxP, rondas, minRonda: minR, ajusteMin: 0,
          finMs: new Date(fecha + 'T' + hora).getTime() + rondas * minR * 60000, creada: serverTimestamp()
        });
      });
      await b.commit();
      S.admJ = ids[0]; S.modal = { t: 'creada', j: ids[0], n: ids.length, v: 1 };
      setTimeout(() => { if (S.modal?.t === 'creada'){ S.modal.v++; doRender(); } }, 700);
      doRender();
    } catch (e){ toast(errMsg(e)); }
  },

  async guardarCirc(el){
    const id = el.dataset.id;
    const data = { nombre: $('ec-nombre').value.trim(), emoji: $('ec-emoji').value.trim() || '🎾', tipoRanking: $('ec-tipo').value, duracion: $('ec-dur').value, acceso: $('ec-acc').value, minPistas: parseInt($('ec-min').value) || 4, maxPistas: parseInt($('ec-max').value) || 8 };
    if (data.nombre.length < 2) return toast('Ponle nombre al circuito');
    if (data.minPistas > data.maxPistas) return toast('El mínimo no puede ser mayor que el máximo');
    try {
      if (id) await updateDoc(doc(db, 'circuitos', id), data);
      else await addDoc(collection(db, 'circuitos'), { ...data, orden: S.circuitos.length + 1 });
      S.editCirc = null; toast('Circuito guardado ✅');
    } catch (e){ toast(errMsg(e)); }
  },
  async borrarTemp(el){
    const tid = el.dataset.id;
    const js = S.jornadas.filter(j => j.temporadaId === tid), rs = S.resultados.filter(r => r.temporadaId === tid);
    const nombre = js[0]?.temporadaNombre || tid;
    if (!confirm(`¿BORRAR la temporada "${nombre}"?\nSe eliminarán ${js.length} americanas y ${rs.length} resultados. No se puede deshacer.`)) return;
    if (!confirm('¿Seguro? Esto borra también todo su ranking.')) return;
    try {
      const b = writeBatch(db);
      for (const j of js){
        (await getDocs(collection(db, 'jornadas', j.id, 'inscritos'))).forEach(d => b.delete(d.ref));
        S.bajas.filter(x => x.jornadaId === j.id).forEach(x => b.delete(doc(db, 'bajas', x.id)));
        b.delete(doc(db, 'jornadas', j.id));
      }
      rs.forEach(r => b.delete(doc(db, 'resultados', r.id)));
      await b.commit(); S.admJ = null; toast('Temporada borrada');
    } catch (e){ toast(errMsg(e)); }
  }
};

async function ponerResAdmin(pid, r){
  const j = S.jornadas.find(x => x.id === S.admJ); if (!j) return;
  try { await setDoc(doc(db, 'resultados', `${j.id}_${pid}`), { jornadaId: j.id, temporadaId: j.temporadaId ?? null, playerId: pid, resultado: r, estado: 'aprobado', por: 'admin', ts: serverTimestamp() }); toast(`${nom(pid)}: ${RES_TXT[r]}`); }
  catch (e){ toast(errMsg(e)); }
}

function sumaDias(f, n){ const d = new Date(f + 'T12:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); }
function fechasNueva(){
  const f = $('nj-fecha')?.value; if (!f) return [];
  if (!$('nj-rep')?.checked) return [f];
  const hasta = $('nj-hasta').value || f, out = [];
  for (let d = f; d <= hasta && out.length < 30; d = sumaDias(d, 7)) out.push(d);
  return out;
}
function finNueva(){
  if (!$('nj-fecha')) return; const f = $('nj-fecha').value, h = $('nj-hora').value; if (!f || !h) return;
  const fin = new Date(f + 'T' + h).getTime() + (parseInt($('nj-rondas').value) || 6) * (parseInt($('nj-minr').value) || 20) * 60000;
  $('nj-fin').innerHTML = `⏱ Termina a las <b>${hhmm(fin)}</b> · pitidos cada ${parseInt($('nj-minr').value) || 20} minutos`;
  const rep = $('nj-rep').checked; $('nj-rep-box').classList.toggle('hidden', !rep);
  if (rep && !$('nj-hasta').value) $('nj-hasta').value = sumaDias(f, 28);
  const fs = fechasNueva();
  $('nj-rep-txt').innerHTML = rep ? `→ Se crean <b>${fs.length} americana${fs.length === 1 ? '' : 's'}</b>: ${fs.map(x => new Date(x + 'T12:00').toLocaleDateString('es-ES', { day: 'numeric', month: 'short' })).join(', ')}` : '';
  $('nj-btn').textContent = fs.length > 1 ? `Crear ${fs.length} americanas` : 'Crear americana';
}

function fsNivel(){ return document.documentElement.classList.contains('fs3') ? 3 : document.documentElement.classList.contains('fs2') ? 2 : 1; }
function setFs(n){ const h = document.documentElement; h.classList.remove('fs2', 'fs3'); if (n > 1) h.classList.add('fs' + n); $('btn-fs').textContent = n === 3 ? 'A–' : 'A+'; }
